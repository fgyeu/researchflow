[pytest]
testpaths = tests
pythonpath = .
# 关键：默认用 -m "not network" 把联网测试排掉。
# 只写 markers = 是**登记**标签，不会跳过测试 —— 这个坑我踩过：
# 结果跑 `pytest tests/` 时联网测试照样执行，在魔搭上直接超时失败。
addopts = -q -m "not network"

# 测试默认走 mock 模式：不联网、不花钱、结果稳定。
# 具体设置在 tests/test_stage1_agent.py 顶部（os.environ.setdefault），
# 不依赖 pytest-env 插件，少一个依赖。
markers =
    network: 需要联网的集成测试，默认跳过。显式跑法：pytest -m network